<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Anamnese de pele — o quiz guiado da sua consultoria de skin care.">
<meta name="robots" content="noindex">
<title>Anamnese da sua pele</title>
<link rel="icon" href="marca/simbolo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<header class="site-header" id="siteHeader"></header>

<main class="secao" style="padding-top:24px">
  <div class="wrap-sm" id="conteudo"></div>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<script src="app.js?v=1"></script>
<script src="quiz.js?v=1"></script>
<script>
let PEDIDO = null;
let respostas = {};
let etapaAtual = 0;
let draftKey = '';

/* ---------------- rascunho ---------------- */
function salvarRascunho(){
  try{ localStorage.setItem(draftKey, JSON.stringify({ respostas, etapaAtual })); }catch(e){}
}
function carregarRascunho(){
  try{
    const d = JSON.parse(localStorage.getItem(draftKey) || 'null');
    if(d && d.respostas){
      respostas = d.respostas;
      etapaAtual = Math.min(Number(d.etapaAtual) || 0, QUIZ_ETAPAS.length - 1);
      return true;
    }
  }catch(e){}
  return false;
}
function limparRascunho(){ localStorage.removeItem(draftKey); }

/* ---------------- render de uma pergunta ---------------- */
function renderPergunta(p){
  const val = respostas[p.id];
  let campo = '';

  if(p.tipo === 'unica'){
    campo = `<div class="opcoes">` + p.opcoes.map(o => `
      <label class="opcao ${val === o.v ? 'marcada' : ''}">
        <input type="radio" name="${esc(p.id)}" value="${esc(o.v)}" ${val === o.v ? 'checked' : ''}>
        <span>${esc(o.label)}${o.desc ? `<span class="op-desc">${esc(o.desc)}</span>` : ''}</span>
      </label>`).join('') + `</div>`;

  }else if(p.tipo === 'multipla'){
    const arr = Array.isArray(val) ? val : [];
    campo = `<div class="opcoes">` + p.opcoes.map(o => `
      <label class="opcao ${arr.includes(o.v) ? 'marcada' : ''}">
        <input type="checkbox" name="${esc(p.id)}" value="${esc(o.v)}" ${arr.includes(o.v) ? 'checked' : ''}>
        <span>${esc(o.label)}</span>
      </label>`).join('') + `</div>`;

  }else if(p.tipo === 'escala'){
    campo = `<div class="escala">` + Array.from({ length: 11 }, (_, i) => `
      <button type="button" data-escala="${esc(p.id)}" data-valor="${i}"
        class="${String(val) === String(i) ? 'on' : ''}">${i}</button>`).join('') + `</div>`;

  }else if(p.tipo === 'textarea'){
    campo = `<textarea name="${esc(p.id)}" placeholder="${esc(p.placeholder || '')}">${esc(val || '')}</textarea>`;

  }else if(p.tipo === 'numero'){
    campo = `<input type="number" name="${esc(p.id)}" value="${esc(val ?? '')}" placeholder="${esc(p.placeholder || '')}">`;

  }else{
    campo = `<input type="text" name="${esc(p.id)}" value="${esc(val ?? '')}" placeholder="${esc(p.placeholder || '')}">`;
  }

  return `
    <div class="pergunta" data-pergunta="${esc(p.id)}">
      <h3>${esc(p.label)}${p.obrigatoria ? ' <span style="color:var(--nude)">*</span>' : ''}</h3>
      ${p.ajuda ? `<p class="ajuda">${esc(p.ajuda)}</p>` : ''}
      ${campo}
      <div class="erro-msg" data-erro="${esc(p.id)}"></div>
    </div>`;
}

/* ---------------- render da etapa ---------------- */
function idsVisiveis(){
  return perguntasVisiveis(QUIZ_ETAPAS[etapaAtual], respostas).map(p => p.id).join('|');
}

function renderEtapa(irAoTopo = true){
  const etapa = QUIZ_ETAPAS[etapaAtual];
  const visiveis = perguntasVisiveis(etapa, respostas);
  const pct = Math.round((etapaAtual / QUIZ_ETAPAS.length) * 100);

  $('#conteudo').innerHTML = `
    <div class="quiz-topo">
      <div class="quiz-meta">
        <span>Bloco ${etapaAtual + 1} de ${QUIZ_ETAPAS.length}</span>
        <span>${esc(PEDIDO.codigo)} · salvo automaticamente</span>
      </div>
      <div class="progresso"><i style="width:${pct}%"></i></div>
    </div>

    <div style="margin:26px 0 20px">
      <h2 class="etapa-nome">${esc(etapa.titulo)}</h2>
      <p class="muted">${esc(etapa.desc || '')}</p>
    </div>

    <div class="painel">
      ${visiveis.map(renderPergunta).join('')}
    </div>

    <div class="quiz-nav">
      <button class="btn btn-ghost" id="btnVoltar">${etapaAtual === 0 ? 'Sair' : 'Voltar'}</button>
      <button class="btn btn-primary" id="btnAvancar">
        ${etapaAtual === QUIZ_ETAPAS.length - 1 ? 'Revisar e enviar' : 'Continuar'}
      </button>
    </div>`;

  ligarEventos();
  if(irAoTopo) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function ligarEventos(){
  const visiveisAntes = idsVisiveis();

  // rádios e checkboxes
  $$('.opcao input').forEach(input => {
    input.addEventListener('change', () => {
      const nome = input.name;
      const p = perguntaPorId(nome);
      if(p.tipo === 'unica'){
        respostas[nome] = input.value;
      }else{
        const marcados = $$(`.opcao input[name="${CSS.escape(nome)}"]:checked`).map(i => i.value);
        if(p.max && marcados.length > p.max){
          input.checked = false;
          toast(`Escolha até ${p.max} opções — desmarque uma antes.`, 'erro');
          return;
        }
        respostas[nome] = marcados;
      }
      // repinta marcação
      $$(`.opcao input[name="${CSS.escape(nome)}"]`).forEach(i =>
        i.closest('.opcao').classList.toggle('marcada', i.checked));
      const erro = $(`[data-erro="${CSS.escape(nome)}"]`);
      if(erro) erro.textContent = '';
      salvarRascunho();
      // se a resposta liberou ou escondeu uma pergunta condicional, redesenha sem tirar a
      // cliente do lugar onde ela estava
      if(idsVisiveis() !== visiveisAntes){
        const y = window.scrollY;
        renderEtapa(false);
        window.scrollTo({ top: y });
      }
    });
  });

  // escala 0-10
  $$('[data-escala]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.escala;
      respostas[id] = Number(btn.dataset.valor);
      $$(`[data-escala="${CSS.escape(id)}"]`).forEach(b => b.classList.toggle('on', b === btn));
      const erro = $(`[data-erro="${CSS.escape(id)}"]`);
      if(erro) erro.textContent = '';
      salvarRascunho();
    });
  });

  // texto livre
  $$('textarea[name], input[type="text"][name], input[type="number"][name]').forEach(el => {
    el.addEventListener('input', () => {
      respostas[el.name] = el.value;
      salvarRascunho();
    });
  });

  $('#btnVoltar').addEventListener('click', () => {
    if(etapaAtual === 0){ location.href = 'area.html'; return; }
    etapaAtual--; salvarRascunho(); renderEtapa();
  });
  $('#btnAvancar').addEventListener('click', avancar);
}

function avancar(){
  const etapa = QUIZ_ETAPAS[etapaAtual];
  const visiveis = perguntasVisiveis(etapa, respostas);
  let primeiroErro = null;

  visiveis.forEach(p => {
    const v = respostas[p.id];
    const vazio = v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);
    const box = $(`[data-erro="${CSS.escape(p.id)}"]`);
    if(p.obrigatoria && vazio){
      if(box) box.textContent = 'Preciso dessa resposta para montar seu protocolo.';
      if(!primeiroErro) primeiroErro = p.id;
    }else if(box){
      box.textContent = '';
    }
  });

  if(primeiroErro){
    $(`[data-pergunta="${CSS.escape(primeiroErro)}"]`).scrollIntoView({ block:'center', behavior:'smooth' });
    return;
  }

  salvarRascunho();
  if(etapaAtual < QUIZ_ETAPAS.length - 1){ etapaAtual++; renderEtapa(); }
  else telaRevisao();
}

/* ---------------- revisão ---------------- */
function blocosRespostas(resp){
  return QUIZ_ETAPAS.map(e => {
    const linhas = perguntasVisiveis(e, resp)
      .filter(p => { const v = resp[p.id]; return !(v === undefined || v === '' || (Array.isArray(v) && !v.length)); })
      .map(p => `<div class="resposta"><dt>${esc(p.label)}</dt><dd>${esc(respostaLegivel(p.id, resp[p.id]))}</dd></div>`)
      .join('');
    return linhas ? `<div class="resposta-grupo"><h4>${esc(e.titulo)}</h4><dl>${linhas}</dl></div>` : '';
  }).join('');
}

function telaRevisao(){
  $('#conteudo').innerHTML = `
    <div class="quiz-topo">
      <div class="quiz-meta"><span>Revisão final</span><span>${esc(PEDIDO.codigo)}</span></div>
      <div class="progresso"><i style="width:100%"></i></div>
    </div>

    <div style="margin:26px 0 20px">
      <h2 class="etapa-nome">Confere se está tudo certo</h2>
      <p class="muted">Depois de enviar, se precisar corrigir alguma coisa é só me chamar no WhatsApp.</p>
    </div>

    <div class="painel">${blocosRespostas(respostas)}</div>

    <div class="quiz-nav">
      <button class="btn btn-ghost" id="btnCorrigir">Voltar e corrigir</button>
      <button class="btn btn-primary" id="btnEnviar">Enviar minha anamnese</button>
    </div>`;

  $('#btnCorrigir').addEventListener('click', () => { etapaAtual = 0; renderEtapa(); });
  $('#btnEnviar').addEventListener('click', enviar);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------------- envio ---------------- */
async function enviar(){
  const btn = $('#btnEnviar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const registro = {
    id: uid(),
    orderId: PEDIDO.id,
    codigo: PEDIDO.codigo,
    nome: PEDIDO.nome,
    email: PEDIDO.email,
    fone: PEDIDO.fone,
    planoNome: PEDIDO.planoNome,
    respostas: structuredClone(respostas),
    resultado: calcularResultado(respostas),
    criadoEm: new Date().toISOString(),
    status: 'recebida',
    notas: ''
  };

  const gravou = await salvarComMerge(db => {
    const jaTem = db.anamneses.find(a => a.orderId === registro.orderId);
    if(jaTem) Object.assign(jaTem, registro, { id: jaTem.id });
    else db.anamneses.push(registro);
    const pedido = db.orders.find(o => o.id === registro.orderId);
    if(pedido) pedido.anamneseId = registro.id;
  });

  limparRascunho();
  toast(gravou ? 'Anamnese enviada 💛' : 'Anamnese salva neste aparelho — me avise no WhatsApp.', gravou ? 'ok' : 'erro');
  setTimeout(() => { location.href = 'area.html'; }, 900);
}

/* ---------------- já respondida ---------------- */
function telaJaRespondida(a){
  $('#conteudo').innerHTML = `
    <div class="secao-head" style="margin-bottom:22px">
      <h2>Sua anamnese já está comigo ✓</h2>
      <p>Enviada em ${fmtDate(a.criadoEm)}. Estas foram as suas respostas.</p>
    </div>
    <div class="painel">${blocosRespostas(a.respostas || {})}</div>
    <div class="quiz-nav">
      <a class="btn btn-ghost" href="area.html">Voltar para a minha área</a>
      <a class="btn btn-nude" target="_blank" rel="noopener"
         href="${linkWhats(`Oi! Sou ${a.nome}, código ${a.codigo}. Preciso corrigir uma resposta da minha anamnese.`)}">Preciso corrigir algo</a>
    </div>`;
}

/* ---------------- boot ---------------- */
(async function(){
  await initDB();
  montarHeader('area');
  montarFooter();

  PEDIDO = pedidoDaSessao();
  if(!PEDIDO){
    $('#conteudo').innerHTML = `
      <div class="painel center">
        <h2 style="font-size:24px;margin-bottom:8px">Entre para fazer a anamnese</h2>
        <p class="muted" style="margin-bottom:18px">Use o código de acesso que você recebeu ao contratar a consultoria.</p>
        <a class="btn btn-primary" href="area.html">Ir para a área da cliente</a>
      </div>`;
    return;
  }

  draftKey = DRAFT_KEY + ':' + PEDIDO.codigo;

  const enviada = anamnesePorPedido(PEDIDO.id);
  if(enviada){ telaJaRespondida(enviada); return; }

  const tinhaRascunho = carregarRascunho();
  renderEtapa();
  if(tinhaRascunho) toast('Continuando de onde você parou');
})();
</script>
</body>
</html>
