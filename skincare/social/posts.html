<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Artes para Instagram — Duda Skin Care</title>
<!-- fontes locais: as artes saem idênticas mesmo sem internet -->
<link rel="stylesheet" href="fontes/fontes.css">
<style>
/* ===========================================================
   Artes de Instagram — Duda Skin Care
   Motivo: a ficha de anamnese (campos, fios finos, caixas de marcar).
   Cada .art é exportada em tamanho real pelo gerar.mjs.
   =========================================================== */
:root{
  --creme:#FBF7F3; --creme2:#F1E7DD; --tinta:#2E2A28; --tinta2:#6B615B;
  --nude:#C08E72; --nudeEsc:#A8724F; --sage:#7C8C7A; --linha:#DCCFC2;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#8a8078;padding:40px;display:flex;flex-wrap:wrap;gap:40px;font-family:var(--sans)}

.art{
  width:1080px;height:1350px;background:var(--creme);color:var(--tinta);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
  padding:96px 88px;flex:0 0 auto;
}
.art.story{height:1920px;padding:180px 88px}
.art.escura{background:var(--tinta);color:var(--creme)}
.art.nude{background:var(--creme2)}

/* --- topo e rodapé da ficha --- */
.topo{display:flex;justify-content:space-between;align-items:center;
  padding-bottom:22px;border-bottom:2px solid var(--tinta);margin-bottom:auto}
.escura .topo{border-color:#5C534E}
.marca{display:flex;align-items:center;gap:14px;font-family:var(--serif);font-size:30px;font-weight:600}
.marca svg{width:44px;height:44px;flex:0 0 auto}
.ficha-num{font-size:19px;letter-spacing:.24em;text-transform:uppercase;color:var(--nudeEsc);font-weight:600}
.escura .ficha-num{color:var(--nude)}

.rodape{display:flex;justify-content:space-between;align-items:center;
  padding-top:22px;border-top:1px solid var(--linha);margin-top:auto;
  font-size:21px;color:var(--tinta2)}
.escura .rodape{border-color:#5C534E;color:#B7AAA1}
.rodape .arrasta{color:var(--nudeEsc);font-weight:600}
.escura .rodape .arrasta{color:var(--nude)}

/* --- tipografia --- */
.miolo{display:flex;flex-direction:column;justify-content:center;flex:1;padding:52px 0;gap:30px}
.eyebrow{font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:var(--nudeEsc);font-weight:600}
.escura .eyebrow{color:var(--nude)}
h1{font-family:var(--serif);font-weight:600;font-size:86px;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
h1.menor{font-size:70px}
h1 em{font-style:italic;color:var(--nudeEsc)}
.escura h1 em{color:var(--nude)}
h2{font-family:var(--serif);font-weight:600;font-size:60px;line-height:1.1;letter-spacing:-.015em}
.lead{font-size:32px;line-height:1.45;color:var(--tinta2);max-width:24ch}
.escura .lead{color:#C9BDB4}

/* --- numeral grande dos erros --- */
.numero{font-family:var(--serif);font-size:210px;line-height:.8;color:var(--nude);opacity:.9;font-weight:400}
.escura .numero{color:var(--nude)}

/* --- linhas de campo (a "ficha") --- */
.campos{display:flex;flex-direction:column;gap:0}
.campo-linha{display:flex;align-items:flex-start;gap:26px;padding:30px 0;border-bottom:1px solid var(--linha)}
.escura .campo-linha{border-color:#4A423E}
.campo-linha:first-child{border-top:1px solid var(--linha)}
.escura .campo-linha:first-child{border-color:#4A423E}
.caixa{width:36px;height:36px;border:2.5px solid var(--nudeEsc);border-radius:6px;flex:0 0 auto;margin-top:5px;
  display:grid;place-items:center}
.caixa.marcada{background:var(--nudeEsc)}
.caixa svg{width:22px;height:22px}
.campo-txt{font-size:31px;line-height:1.35}
.campo-txt small{display:block;font-size:24px;color:var(--tinta2);margin-top:7px}
.escura .campo-txt small{color:#B7AAA1}

/* --- lista de passos numerados --- */
.passos{display:flex;flex-direction:column;gap:34px}
.passo{display:flex;gap:28px;align-items:flex-start}
.passo b{font-family:var(--serif);font-size:46px;font-weight:600;color:var(--nudeEsc);line-height:1;flex:0 0 62px}
.escura .passo b{color:var(--nude)}
.passo div{font-size:31px;line-height:1.4}
.passo div small{display:block;font-size:25px;color:var(--tinta2);margin-top:6px}
.escura .passo div small{color:#B7AAA1}

/* --- comparação erro/certo --- */
.par{display:grid;grid-template-columns:1fr;gap:22px}
.bloco{border:2px solid var(--linha);border-radius:20px;padding:34px 36px}
.escura .bloco{border-color:#4A423E}
.bloco .tag{font-size:19px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-bottom:14px;display:block}
.bloco.errado .tag{color:#B4544A}
.bloco.certo{border-color:var(--sage)}
.bloco.certo .tag{color:var(--sage)}
.bloco p{font-size:30px;line-height:1.4}

/* --- planos --- */
.planos{display:flex;flex-direction:column;gap:20px}
.plano{display:flex;justify-content:space-between;align-items:baseline;gap:20px;
  padding:28px 0;border-bottom:1px solid var(--linha)}
.escura .plano{border-color:#4A423E}
.plano .nome{font-family:var(--serif);font-size:44px;font-weight:600}
.plano .desc{font-size:24px;color:var(--tinta2);margin-top:6px}
.escura .plano .desc{color:#B7AAA1}
.plano .preco{font-family:var(--serif);font-size:44px;font-weight:600;color:var(--nudeEsc);white-space:nowrap}
.escura .plano .preco{color:var(--nude)}

/* --- selo / botão --- */
.btn{display:inline-block;background:var(--tinta);color:var(--creme);font-size:29px;font-weight:600;
  padding:26px 46px;border-radius:99px;align-self:flex-start}
.escura .btn{background:var(--creme);color:var(--tinta)}

/* --- ornamento --- */
.gota{position:absolute;border-radius:50%;pointer-events:none}
.g1{width:620px;height:620px;right:-220px;top:-180px;background:radial-gradient(circle,#EEDDD0,transparent 70%)}
.g2{width:520px;height:520px;left:-200px;bottom:-160px;background:radial-gradient(circle,#E3EAE1,transparent 70%)}
.escura .g1{background:radial-gradient(circle,rgba(192,142,114,.35),transparent 70%)}

.aviso-legal{font-size:19px;color:var(--tinta2);line-height:1.4;max-width:36ch}
.escura .aviso-legal{color:#9C918A}
</style>
</head>
<body>
<script>
const LOGO = `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#C08E72"/><path d="M32 15c9 6 13 12 13 18a13 13 0 0 1-26 0c0-6 4-12 13-18z" fill="#FDF8F4"/></svg>`;
const CHECK = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5.5 5.5L20 7" stroke="#FBF7F3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const topo = (num) => `<div class="topo"><div class="marca">${LOGO}<span>Duda Skin Care</span></div><span class="ficha-num">${num}</span></div>`;
const rodape = (txt, arrasta) => `<div class="rodape"><span>${txt}</span>${arrasta ? `<span class="arrasta">${arrasta}</span>` : ''}</div>`;
const campo = (t, s, marcada) => `<div class="campo-linha"><span class="caixa ${marcada ? 'marcada' : ''}">${marcada ? CHECK : ''}</span><span class="campo-txt">${t}${s ? `<small>${s}</small>` : ''}</span></div>`;
const passo = (n, t, s) => `<div class="passo"><b>${n}</b><div>${t}${s ? `<small>${s}</small>` : ''}</div></div>`;

/* ---------- conteúdo ---------- */
const ARTES = [

/* ===== CARROSSEL 1 — 5 erros ===== */
{ id:'c1-capa', classe:'escura', html:`
  <div class="gota g1"></div>
  ${topo('Ficha 01')}
  <div class="miolo">
    <span class="eyebrow">Anamnese de pele</span>
    <h1>5 erros que fazem a sua pele <em>piorar</em></h1>
    <p class="lead">Todos eles são comuns. Três deles provavelmente estão na sua rotina agora.</p>
  </div>
  ${rodape('@dudaskincare', 'arrasta →')}`},

{ id:'c1-erro1', html:`
  ${topo('Erro 01')}
  <div class="miolo">
    <span class="numero">01</span>
    <h2>Lavar o rosto com sabonete de corpo</h2>
    <p class="lead">O pH é outro. Ele tira a camada que protege a sua pele e ela responde produzindo mais óleo — ou repuxando.</p>
    <div class="par"><div class="bloco certo"><span class="tag">No lugar disso</span><p>Sabonete facial adequado ao seu tipo de pele, 1 a 2 vezes por dia.</p></div></div>
  </div>
  ${rodape('@dudaskincare', 'arrasta →')}`},

{ id:'c1-erro2', classe:'nude', html:`
  ${topo('Erro 02')}
  <div class="miolo">
    <span class="numero">02</span>
    <h2>Pular o hidratante porque a pele é oleosa</h2>
    <p class="lead">Pele oleosa também fica desidratada. E pele desidratada costuma produzir ainda mais oleosidade.</p>
    <div class="par"><div class="bloco certo"><span class="tag">No lugar disso</span><p>Hidratante de textura leve, em gel ou sérum. Oleosidade e hidratação são coisas diferentes.</p></div></div>
  </div>
  ${rodape('@dudaskincare', 'arrasta →')}`},

{ id:'c1-erro3', html:`
  ${topo('Erro 03')}
  <div class="miolo">
    <span class="numero">03</span>
    <h2>Esfoliar todo dia para “limpar melhor”</h2>
    <p class="lead">Esfoliação em excesso machuca a barreira da pele. O resultado costuma ser ardência, vermelhidão e mais sensibilidade.</p>
    <div class="par"><div class="bloco certo"><span class="tag">No lugar disso</span><p>Esfoliação com frequência definida para o seu caso — e nunca com a pele irritada.</p></div></div>
  </div>
  ${rodape('@dudaskincare', 'arrasta →')}`},

{ id:'c1-erro4', classe:'nude', html:`
  ${topo('Erro 04')}
  <div class="miolo">
    <span class="numero">04</span>
    <h2>Começar três ativos novos na mesma semana</h2>
    <p class="lead">Se a pele reagir, você não vai saber qual deles foi. E vai jogar fora um produto que talvez fosse ótimo.</p>
    <div class="par"><div class="bloco certo"><span class="tag">No lugar disso</span><p>Um ativo por vez, com tempo para a pele responder antes do próximo.</p></div></div>
  </div>
  ${rodape('@dudaskincare', 'arrasta →')}`},

{ id:'c1-erro5', html:`
  ${topo('Erro 05')}
  <div class="miolo">
    <span class="numero">05</span>
    <h2>Usar protetor solar só quando vai pegar sol</h2>
    <p class="lead">A luz do dia atravessa a janela. Sem fotoproteção diária, qualquer tratamento de mancha anda para trás.</p>
    <div class="par"><div class="bloco certo"><span class="tag">No lugar disso</span><p>Protetor todo dia, com reaplicação quando você fica exposta.</p></div></div>
  </div>
  ${rodape('@dudaskincare', 'arrasta →')}`},

{ id:'c1-fecho', classe:'escura', html:`
  <div class="gota g1"></div>
  ${topo('Ficha 01')}
  <div class="miolo">
    <h1 class="menor">Quantos desses estão na sua rotina hoje?</h1>
    <p class="lead">Na consultoria eu começo exatamente por aqui: entender o que você já faz, antes de indicar qualquer produto.</p>
    <span class="btn">Link na bio</span>
  </div>
  ${rodape('@dudaskincare', 'salva para depois')}`},

/* ===== POST — tipo de pele ===== */
{ id:'p-tipo', html:`
  <div class="gota g2"></div>
  ${topo('Ficha 02')}
  <div class="miolo">
    <span class="eyebrow">Marque o que acontece com você</span>
    <h1 class="menor">Você sabe mesmo qual é o seu tipo de pele?</h1>
    <div class="campos">
      ${campo('Repuxa logo depois de lavar', 'Sinal de pele seca ou desidratada')}
      ${campo('Brilha só na testa, nariz e queixo', 'Sinal de pele mista')}
      ${campo('Volta a brilhar inteira em duas horas', 'Sinal de pele oleosa')}
      ${campo('Arde ou avermelha com produto novo', 'Isso não é tipo de pele — é sensibilidade, e muda todo o protocolo')}
    </div>
  </div>
  ${rodape('@dudaskincare', 'comenta qual é a sua')}`},

/* ===== POST — o que é anamnese ===== */
{ id:'p-anamnese', classe:'nude', html:`
  ${topo('Ficha 03')}
  <div class="miolo">
    <span class="eyebrow">Antes de qualquer produto</span>
    <h1 class="menor">O que é uma <em>anamnese</em> de pele?</h1>
    <p class="lead">É a entrevista que mapeia a sua pele antes de montar a rotina. Na minha consultoria ela pergunta:</p>
    <div class="campos">
      ${campo('Como sua pele se comporta ao longo do dia', null, true)}
      ${campo('O que você já usa e como reagiu', null, true)}
      ${campo('Gestação, medicamentos, alergias e diagnósticos', null, true)}
      ${campo('Quanto tempo e quanto dinheiro você tem para a rotina', null, true)}
    </div>
  </div>
  ${rodape('@dudaskincare', 'link na bio')}`},

/* ===== POST — como funciona ===== */
{ id:'p-como', html:`
  <div class="gota g1"></div>
  ${topo('Ficha 04')}
  <div class="miolo">
    <span class="eyebrow">Como funciona</span>
    <h1 class="menor">Da anamnese à sua rotina, em 4 passos</h1>
    <div class="passos">
      ${passo('1', 'Você escolhe seu plano', 'Recebe na hora o código de acesso à sua área')}
      ${passo('2', 'Responde a anamnese', 'Um quiz guiado, no seu tempo, sem termo difícil')}
      ${passo('3', 'Eu analiso tudo', 'Leio suas respostas e monto o protocolo')}
      ${passo('4', 'Você recebe sua rotina', 'Manhã e noite, com ordem de uso e frequência')}
    </div>
  </div>
  ${rodape('@dudaskincare', 'link na bio')}`},

/* ===== POST — rotina mínima ===== */
{ id:'p-rotina', classe:'escura', html:`
  <div class="gota g1"></div>
  ${topo('Ficha 05')}
  <div class="miolo">
    <span class="eyebrow">O básico bem feito</span>
    <h1 class="menor">Se você só puder fazer três coisas pela sua pele</h1>
    <div class="passos">
      ${passo('1', 'Limpar', 'Sabonete facial adequado, de manhã e à noite')}
      ${passo('2', 'Hidratar', 'Sim, também se a sua pele for oleosa')}
      ${passo('3', 'Proteger', 'Protetor solar todo dia, faça chuva ou sol')}
    </div>
    <p class="lead">Rotina de três produtos, bem escolhidos, ganha de gaveta cheia de produto aleatório.</p>
  </div>
  ${rodape('@dudaskincare', 'salva para lembrar')}`},

/* ===== POST — planos ===== */
{ id:'p-planos', html:`
  <div class="gota g2"></div>
  ${topo('Ficha 06')}
  <div class="miolo">
    <span class="eyebrow">Consultoria de skin care</span>
    <h1 class="menor">Escolha o acompanhamento que cabe em você</h1>
    <div class="planos">
      <div class="plano"><div><div class="nome">Essencial</div><div class="desc">Anamnese + protocolo em PDF + 7 dias de suporte</div></div><span class="preco">R$ 197</span></div>
      <div class="plano"><div><div class="nome">Completa</div><div class="desc">Tudo do Essencial + videochamada + 30 dias de suporte</div></div><span class="preco">R$ 347</span></div>
      <div class="plano"><div><div class="nome">90 dias</div><div class="desc">3 encontros + reavaliação por fotos a cada mês</div></div><span class="preco">R$ 597</span></div>
    </div>
    <p class="aviso-legal">Consultoria de skin care é orientação estética e educativa. Não substitui consulta, diagnóstico ou prescrição médica.</p>
  </div>
  ${rodape('@dudaskincare', 'link na bio')}`},

/* ===== STORIES ===== */
{ id:'s-enquete', classe:'story escura', html:`
  <div class="gota g1"></div>
  ${topo('Story')}
  <div class="miolo">
    <span class="eyebrow">Responde aí 👇</span>
    <h1>Sua pele repuxa depois que você lava o rosto?</h1>
    <p class="lead">A resposta muda completamente o sabonete que eu indicaria para você.</p>
  </div>
  ${rodape('@dudaskincare', '')}`},

{ id:'s-cta', classe:'story', html:`
  <div class="gota g1"></div>
  <div class="gota g2"></div>
  ${topo('Story')}
  <div class="miolo">
    <span class="eyebrow">Consultoria de skin care</span>
    <h1>Sua pele merece um plano, não um palpite.</h1>
    <p class="lead">Anamnese completa, protocolo personalizado e suporte de verdade.</p>
    <span class="btn">Link na bio ↗</span>
  </div>
  ${rodape('@dudaskincare', '')}`},

{ id:'s-erro', classe:'story nude', html:`
  ${topo('Story')}
  <div class="miolo">
    <span class="numero">01</span>
    <h1 class="menor">Lavar o rosto com sabonete de corpo</h1>
    <p class="lead">Está no post de hoje, junto com outros 4 erros que quase toda pele passa.</p>
    <span class="btn">Ver o post</span>
  </div>
  ${rodape('@dudaskincare', '')}`}
];

document.body.innerHTML = ARTES.map(a =>
  `<div class="art ${a.classe || ''}" id="${a.id}">${a.html}</div>`).join('');
</script>
</body>
</html>
