<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="description" content="Sistema de gestão (ERP/PDV) da Estilo Fashion — vendas, estoque, financeiro e loja virtual.">
<meta name="robots" content="noindex, nofollow">
<title>Estilo Fashion — Sistema</title>
<link rel="icon" href="marca/simbolo.svg?v=26" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://sjuvryprgbkrbzkvnnhw.supabase.co">
<!-- A fonte não pode segurar a tela: medimos que o login demorava exatamente
     o que o servidor do Google demorasse (5 s de atraso = 5 s de tela branca).
     Assim ela carrega em paralelo e o sistema abre na hora, com a fonte de
     reserva, trocando sozinho quando a definitiva chega. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="style.css?v=26">
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <img src="marca/simbolo.svg?v=26" alt="" class="brand-mark">
    <h1>Estilo Fashion</h1>
    <p class="slogan">Moda que realça quem você é ✨</p>
    <form id="loginForm">
      <label for="loginUser">Usuário</label>
      <input id="loginUser" autocomplete="username" required>
      <label for="loginPass">Senha</label>
      <input id="loginPass" type="password" autocomplete="current-password" required>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>
    <div class="login-hint" id="loginHint"></div>
    <div class="login-version" id="loginVersion"></div>
    <button type="button" class="login-help" id="loginHelpBtn">Não consigo entrar</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="marca/simbolo.svg?v=26" alt="">
      <span id="sidebarStoreName">Estilo Fashion</span>
    </div>
    <ul class="nav-list" id="navList"></ul>
    <div class="sidebar-footer">
      <div id="userPill" style="margin-bottom:8px"></div>
      <button id="logoutBtn">Sair</button>
      <div id="appVersion" style="margin-top:8px;font-size:10.5px;opacity:.55"></div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <button id="menuToggle" class="btn btn-icon menu-toggle">☰</button>
        <h1 id="viewTitle">Painel</h1>
      </div>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<!-- Gera o PDF das etiquetas já no tamanho certo. O Safari do iPhone ignora
     o tamanho de página pedido pelo site, mas respeita o que vem dentro de
     um PDF — por isso no celular a impressão sai por aqui. -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="app.js?v=26"></script>
</body>
</html>
