<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sistema de gestão (ERP/PDV) da Estilo & Cia — vendas, estoque, financeiro e loja virtual.">
<meta name="robots" content="noindex, nofollow">
<title>Estilo & Cia — Sistema</title>
<link rel="icon" href="marca/simbolo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://sjuvryprgbkrbzkvnnhw.supabase.co">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <img src="marca/simbolo.svg" alt="" class="brand-mark">
    <h1>Estilo & Cia</h1>
    <p class="slogan">Estilo que é só seu ✨</p>
    <form id="loginForm">
      <label for="loginUser">Usuário</label>
      <input id="loginUser" autocomplete="username" required>
      <label for="loginPass">Senha</label>
      <input id="loginPass" type="password" autocomplete="current-password" required>
      <div class="login-error" id="loginError"></div>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>
    <div class="login-hint">admin / 1234</div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="marca/simbolo.svg" alt="">
      <span id="sidebarStoreName">Estilo & Cia</span>
    </div>
    <ul class="nav-list" id="navList"></ul>
    <div class="sidebar-footer">
      <div id="userPill" style="margin-bottom:8px"></div>
      <button id="logoutBtn">Sair</button>
      <div id="appVersion" style="margin-top:8px;font-size:10.5px;opacity:.55"></div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <button id="menuToggle" class="btn btn-icon menu-toggle">☰</button>
        <h1 id="viewTitle">Painel</h1>
      </div>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="app.js?v=14"></script>
</body>
</html>
