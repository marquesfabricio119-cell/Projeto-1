<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130">
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EE7FA3"/>
      <stop offset="55%" stop-color="#D3466F"/>
      <stop offset="100%" stop-color="#A32F55"/>
    </linearGradient>
    <!-- folha reutilizável, ~15 de comprimento -->
    <path id="folha" d="M0 0 C5 -4.5 12 -4 15 0 C12 4 5 4.5 0 0 Z"/>
  </defs>

  <!-- selo -->
  <circle cx="62" cy="65" r="46" fill="#FBE8EE"/>
  <circle cx="62" cy="65" r="39" fill="none" stroke="url(#rg)" stroke-width="1.2"/>
  <text x="62" y="78" text-anchor="middle" font-family="Playfair Display, Georgia, serif"
        font-weight="700" font-size="38" fill="url(#rg)" letter-spacing="0.5">EF</text>

  <!-- ramo, acompanhando a lateral direita do selo -->
  <g fill="url(#rg)">
    <path d="M120 98 C114 82 113 66 118 48" stroke="url(#rg)" stroke-width="1.3" fill="none"/>
    <use href="#folha" transform="translate(118,50) rotate(-34)"/>
    <use href="#folha" transform="translate(116,64) rotate(-16)"/>
    <use href="#folha" transform="translate(117,79) rotate(0)"/>
    <use href="#folha" transform="translate(115,57) rotate(-148) scale(.78)"/>
    <use href="#folha" transform="translate(115,72) rotate(-164) scale(.78)"/>
  </g>

  <!-- assinatura -->
  <text x="146" y="62" font-family="Playfair Display, Georgia, serif" font-weight="700"
        font-size="35" fill="url(#rg)" letter-spacing="4">ESTILO</text>
  <text x="148" y="85" font-family="Poppins, sans-serif" font-size="15"
        letter-spacing="8" fill="#D3466F">FASHION</text>
  <text x="148" y="105" font-family="Poppins, sans-serif" font-size="9.5"
        letter-spacing="2.6" fill="#8A8A99">MODA QUE REALÇA QUEM VOCÊ É</text>
</svg>
