<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EE7FA3"/>
      <stop offset="55%" stop-color="#D3466F"/>
      <stop offset="100%" stop-color="#A32F55"/>
    </linearGradient>
  </defs>
  <!-- Em tamanho de favicon o ramo de folhas vira ruído: o símbolo fica
       só com o monograma. O ramo aparece no logotipo completo. -->
  <circle cx="32" cy="32" r="31" fill="#FBE8EE"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#rg)" stroke-width="1.1"/>
  <text x="32" y="41" text-anchor="middle" font-family="Playfair Display, Georgia, serif"
        font-weight="700" font-size="26" fill="url(#rg)" letter-spacing="0.5">EF</text>
</svg>
