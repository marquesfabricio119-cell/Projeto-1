<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1613" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Seu Professor de Inglês com IA — converse, seja corrigido e entenda tudo em português."
    />
    <title>Seu Professor de Inglês com IA · Idioma Visual</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema antes de pintar a tela, para não piscar branco no escuro.
      (function () {
        try {
          var salvo = localStorage.getItem('professor-ingles:tema');
          var escuro =
            salvo === 'escuro' ||
            (!salvo && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (escuro) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage bloqueado: segue no tema claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
